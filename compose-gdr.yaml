version: '3'
services:

  ggr:
    restart: always
    image: aerokube/ggr
    links:
      - ggr-ui
    ports:
      - "4446:4446"
    volumes:
      - "./selenoid/grid-router:/etc/grid-router:ro"
    command: [ "-quotaDir", "/etc/grid-router/quota", "-listen", ":4446" ]

  ggr-ui:
    restart: always
    image: aerokube/ggr-ui
    ports:
      - "8888:8888"
    volumes:
      - "./selenoid/grid-router:/etc/grid-router:ro"

  selenoid-ui:
    restart: always
    image: aerokube/selenoid-ui
    links:
      - ggr-ui
    ports:
      - "8080:8080"
    command: [ "--selenoid-uri", "http://ggr-ui:8888" ]

  selenoid:
    network_mode: bridge
    image: aerokube/selenoid:latest-release
    volumes:
      - "./selenoid/config:/etc/selenoid/:ro"
      - "//var/run/docker.sock:/var/run/docker.sock"
      - "./selenoid/video:/opt/selenoid/video:rw"
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/Users/pawelhat/IdeaProjects/java-carina-testing/selenoid/video
      - ENABLE_VIDEO=true
    command: [ "-conf", "/etc/selenoid/browsers.json", "-video-output-dir", "/opt/selenoid/video" ]
    ports:
      - "4444:4444"